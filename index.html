<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- PWA meta tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#06122F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="App de roteiro de inspeção sanitária — TreinaVISA" />
    
    <!-- Google Fonts: Sora (títulos) + Source Sans 3 (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>InspecVISA</title>

    <!-- FE-12: o tema tem que estar decidido ANTES da primeira pintura. O React só
         monta depois, e sem isto quem usa o escuro vê um lampejo branco a cada
         abertura. Lê o mesmo localStorage do zustand (`inspec-visa-settings`);
         se falhar, o app fica no claro e o efeito do App.tsx corrige em seguida. -->
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('inspec-visa-settings') || '{}');
        if (s && s.state && s.state.settings && s.state.settings.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage bloqueado ou corrompido: segue no claro */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

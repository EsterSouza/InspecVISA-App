<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sala Estetica 3D</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'

const scene = new THREE.Scene()
scene.background = new THREE.Color(0xf5f2ed)
scene.environmentIntensity = 1.0

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100)
camera.position.set(3.5, 2.2, 3.5)

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false })
renderer.setSize(window.innerWidth, window.innerHeight)
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
renderer.toneMapping = THREE.ACESFilmicToneMapping
renderer.toneMappingExposure = 1.1
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
document.body.appendChild(renderer.domElement)

const controls = new OrbitControls(camera, renderer.domElement)
controls.enableDamping = true
controls.dampingFactor = 0.05
controls.minDistance = 1.5
controls.maxDistance = 8
controls.maxPolarAngle = Math.PI / 2.1
controls.target.set(0, 0.9, 0)

new RGBELoader().load('https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/potsdamer_platz_1k.hdr', function(texture) {
  texture.mapping = THREE.EquirectangularReflectionMapping
  scene.environment = texture
  scene.environmentIntensity = 0.6
})

const floorGeo = new THREE.PlaneGeometry(12, 12)
const floorMat = new THREE.MeshStandardMaterial({ 
  color: 0xfaf7f2, 
  roughness: 0.7, 
  metalness: 0.05 
})
const floor = new THREE.Mesh(floorGeo, floorMat)
floor.rotation.x = -Math.PI / 2
floor.receiveShadow = true
scene.add(floor)

const wallMat = new THREE.MeshStandardMaterial({ 
  color: 0xe8e4df, 
  roughness: 0.8, 
  metalness: 0.02 
})
const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 3.5, 0.2), wallMat)
backWall.position.set(0, 1.75, -5.9)
backWall.receiveShadow = true
scene.add(backWall)

const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.5, 12), wallMat)
leftWall.position.set(-5.9, 1.75, 0)
leftWall.receiveShadow = true
scene.add(leftWall)

const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.5, 12), wallMat)
rightWall.position.set(5.9, 1.75, 0)
rightWall.receiveShadow = true
scene.add(rightWall)

const frontWall = new THREE.Mesh(new THREE.BoxGeometry(12, 3.5, 0.2), wallMat)
frontWall.position.set(0, 1.75, 5.9)
frontWall.receiveShadow = true
scene.add(frontWall)

function createCabinet(x, y, z, rotY, w, h, d, color) {
  const group = new THREE.Group()
  
  const bodyMat = new THREE.MeshStandardMaterial({ 
    color: color || 0x2a2520, 
    roughness: 0.6, 
    metalness: 0.15 
  })
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat)
  body.position.y = h / 2
  body.castShadow = true
  body.receiveShadow = true
  group.add(body)
  
  const topMat = new THREE.MeshStandardMaterial({ 
    color: 0x3a3530, 
    roughness: 0.5, 
    metalness: 0.3 
  })
  const top = new THREE.Mesh(new THREE.BoxGeometry(w + 0.08, 0.04, d + 0.08), topMat)
  top.position.y = h + 0.02
  top.castShadow = true
  top.receiveShadow = true
  group.add(top)
  
  const doorGeo = new THREE.BoxGeometry(w - 0.06, h - 0.12, 0.02)
  const doorMat = new THREE.MeshStandardMaterial({ 
    color: 0xd4cfc8, 
    roughness: 0.5, 
    metalness: 0.2 
  })
  
  const leftDoor = new THREE.Mesh(doorGeo, doorMat)
  leftDoor.position.set(-w * 0.25, h * 0.5 - 0.06, d * 0.5 + 0.02)
  leftDoor.castShadow = true
  group.add(leftDoor)
  
  const rightDoor = new THREE.Mesh(doorGeo, doorMat)
  rightDoor.position.set(w * 0.25, h * 0.5 - 0.06, d * 0.5 + 0.02)
  rightDoor.castShadow = true
  group.add(rightDoor)
  
  const handleMat = new THREE.MeshStandardMaterial({ 
    color: 0xc9b8a6, 
    roughness: 0.3, 
    metalness: 0.8 
  })
  
  const lhGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.03, 12)
  const lh = new THREE.Mesh(lhGeo, handleMat)
  lh.rotation.z = Math.PI / 2
  lh.position.set(-w * 0.25, h * 0.5 - 0.06, d * 0.5 + 0.045)
  group.add(lh)
  
  const rh = new THREE.Mesh(lhGeo, handleMat)
  rh.rotation.z = Math.PI / 2
  rh.position.set(w * 0.25, h * 0.5 - 0.06, d * 0.5 + 0.045)
  group.add(rh)
  
  group.position.set(x, y, z)
  group.rotation.y = rotY || 0
  scene.add(group)
  return group
}

function createChair(x, z, rotY) {
  const group = new THREE.Group()
  
  const legMat = new THREE.MeshStandardMaterial({ 
    color: 0x8b7355, 
    roughness: 0.5, 
    metalness: 0.1 
  })
  
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.35, 12), legMat)
    leg.position.set(Math.cos(angle) * 0.22, 0.175, Math.sin(angle) * 0.22)
    leg.castShadow = true
    group.add(leg)
  }
  
  const seatMat = new THREE.MeshStandardMaterial({ 
    color: 0xf5ede6, 
    roughness: 0.8, 
    metalness: 0.02 
  })
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.03, 24), seatMat)
  seat.position.y = 0.33
  seat.castShadow = true
  group.add(seat)
  
  const backMat = new THREE.MeshStandardMaterial({ 
    color: 0xece5dd, 
    roughness: 0.8, 
    metalness: 0.02 
  })
  const back = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.025, 24, 1, false, 0, Math.PI), backMat)
  back.position.y = 0.58
  back.rotation.z = Math.PI / 2
  back.castShadow = true
  group.add(back)
  
  for (let i = 0; i < 5; i++) {
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.42, 8), legMat)
    bar.position.y = 0.42
    bar.rotation.x = Math.PI / 2
    bar.rotation.z = (i / 4) * Math.PI * 0.5
    group.add(bar)
  }
  
  group.position.set(x, 0, z)
  group.rotation.y = rotY || 0
  scene.add(group)
  return group
}

function createTable(x, z) {
  const group = new THREE.Group()
  
  const legMat = new THREE.MeshStandardMaterial({ 
    color: 0x7a6a5a, 
    roughness: 0.5, 
    metalness: 0.15 
  })
  const topMat = new THREE.MeshStandardMaterial({ 
    color: 0x9a8a7a, 
    roughness: 0.4, 
    metalness: 0.25 
  })
  
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.38, 16), legMat)
    leg.position.set(Math.cos(angle) * 0.5, 0.19, Math.sin(angle) * 0.5)
    leg.castShadow = true
    group.add(leg)
  }
  
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 0.04, 32), topMat)
  top.position.y = 0.39
  top.castShadow = true
  group.add(top)
  
  group.position.set(x, 0, z)
  scene.add(group)
  return group
}

function createBed(x, z) {
  const group = new THREE.Group()
  
  const frameMat = new THREE.MeshStandardMaterial({ 
    color: 0xc4b8a8, 
    roughness: 0.6, 
    metalness: 0.1 
  })
  const mattressMat = new THREE.MeshStandardMaterial({ 
    color: 0xf0e6dc, 
    roughness: 0.9, 
    metalness: 0.02 
  })
  
  const frame = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.25, 0.85), frameMat)
  frame.position.y = 0.125
  frame.castShadow = true
  frame.receiveShadow = true
  group.add(frame)
  
  const mattress = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.12, 0.75), mattressMat)
  mattress.position.y = 0.21
  mattress.castShadow = true
  mattress.receiveShadow = true
  group.add(mattress)
  
  const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.04, 0.32), new THREE.MeshStandardMaterial({ color: 0xfffaf6, roughness: 0.9, metalness: 0.01 }))
  pillow.position.set(0, 0.26, -0.12)
  pillow.castShadow = true
  group.add(pillow)
  
  group.position.set(x, 0, z)
  scene.add(group)
  return group
}

function createSink(x, z) {
  const group = new THREE.Group()
  
  const baseMat = new THREE.MeshStandardMaterial({ 
    color: 0xe0d6cc, 
    roughness: 0.4, 
    metalness: 0.3 
  })
  const bowlGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.1, 32, 1, false, 0, Math.PI)
  const bowl = new THREE.Mesh(bowlGeo, baseMat)
  bowl.rotation.x = Math.PI
  bowl.position.y = 0.35
  bowl.castShadow = true
  bowl.receiveShadow = true
  group.add(bowl)
  
  const cabinet = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.45), new THREE.MeshStandardMaterial({ color: 0xd4cfc8, roughness: 0.7, metalness: 0.05 }))
  cabinet.position.y = 0.3
  cabinet.castShadow = true
  cabinet.receiveShadow = true
  group.add(cabinet)
  
  group.position.set(x, 0, z)
  scene.add(group)
  return group
}

function createMirror(x, y, z) {
  const group = new THREE.Group()
  
  const frameMat = new THREE.MeshStandardMaterial({ 
    color: 0x8a7a6a, 
    roughness: 0.5, 
    metalness: 0.3 
  })
  const frame = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.4, 0.04), frameMat)
  frame.castShadow = true
  group.add(frame)
  
  const glassMat = new THREE.MeshStandardMaterial({ 
    color: 0xf0f0f0, 
    roughness: 0.1, 
    metalness: 0.9, 
    envMapIntensity: 1.5 
  })
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 1.32), glassMat)
  glass.position.z = 0.021
  group.add(glass)
  
  group.position.set(x, y, z)
  scene.add(group)
  return group
}

function createLamp(x, z) {
  const group = new THREE.Group()
  
  const poleMat = new THREE.MeshStandardMaterial({ 
    color: 0xd4cfc8, 
    roughness: 0.4, 
    metalness: 0.5 
  })
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1.8, 12), poleMat)
  pole.position.y = 0.9
  pole.castShadow = true
  group.add(pole)
  
  const shadeMat = new THREE.MeshStandardMaterial({ 
    color: 0xf5f0e6, 
    roughness: 0.8, 
    metalness: 0.1 
  })
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.12, 20), shadeMat)
  shade.position.y = 1.65
  shade.castShadow = true
  group.add(shade)
  
  const bulbGeo = new THREE.SphereGeometry(0.04, 12, 12)
  const bulbMat = new THREE.MeshBasicMaterial({ color: 0xfff0c0 })
  const bulb = new THREE.Mesh(bulbGeo, bulbMat)
  bulb.position.y = 1.72
  group.add(bulb)
  
  group.position.set(x, 0, z)
  scene.add(group)
  return group
}

function createShelf(x, z, rotY) {
  const group = new THREE.Group()
  
  const woodMat = new THREE.MeshStandardMaterial({ 
    color: 0xb8a898, 
    roughness: 0.6, 
    metalness: 0.1 
  })
  
  const board = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.3), woodMat)
  board.position.y = 0.015
  board.castShadow = true
  board.receiveShadow = true
  group.add(board)
  
  const leg1 = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), woodMat)
  leg1.position.set(-0.45, 0.2, -0.1)
  leg1.castShadow = true
  group.add(leg1)
  
  const leg2 = leg1.clone()
  leg2.position.set(0.45, 0.2, -0.1)
  group.add(leg2)
  
  const leg3 = leg1.clone()
  leg3.position.set(-0.45, 0.2, 0.1)
  group.add(leg3)
  
  const leg4 = leg1.clone()
  leg4.position.set(0.45, 0.2, 0.1)
  group.add(leg4)
  
  group.position.set(x, 0, z)
  group.rotation.y = rotY || 0
  scene.add(group)
  return group
}

function createPlant(x, z) {
  const group = new THREE.Group()
  
  const potMat = new THREE.MeshStandardMaterial({ 
    color: 0x9a8a7a, 
    roughness: 0.6, 
    metalness: 0.1 
  })
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 0.14, 16), potMat)
  pot.position.y = 0.07
  pot.castShadow = true
  group.add(pot)
  
  const soilMat = new THREE.MeshStandardMaterial({ 
    color: 0x5a4a3a, 
    roughness: 0.8, 
    metalness: 0.02 
  })
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.04, 16), soilMat)
  soil.position.y = 0.11
  soil.castShadow = true
  group.add(soil)
  
  const leafMat = new THREE.MeshStandardMaterial({ 
    color: 0x4a6a3a, 
    roughness: 0.9, 
    metalness: 0.02 
  })
  
  for (let i = 0; i < 5; i++) {
    const angle = (i / 5) * Math.PI * 2 + 0.5
    const leaf = new THREE.Mesh(new THREE.EllipseCurve(0, 0, 0.08, 0.15, 0, Math.PI * 2, false, 0).createPointsGeometry(32), leafMat)
    leaf.position.set(Math.cos(angle) * 0.05, 0.14 + Math.sin(i) * 0.02, Math.sin(angle) * 0.05)
    leaf.rotation.x = Math.PI / 2
    leaf.rotation.z = angle
    leaf.castShadow = true
    group.add(leaf)
  }
  
  const topLeaf = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.12, 8), leafMat)
  topLeaf.position.y = 0.22
  topLeaf.castShadow = true
  group.add(topLeaf)
  
  group.position.set(x, 0, z)
  scene.add(group)
  return group
}

function createProductDisplay(x, z, rotY) {
  const group = new THREE.Group()
  
  const standMat = new THREE.MeshStandardMaterial({ 
    color: 0xd4cfc8, 
    roughness: 0.5, 
    metalness: 0.3 
  })
  const stand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.3), standMat)
  stand.position.y = 0.4
  stand.castShadow = true
  group.add(stand)
  
  const glassMat = new THREE.MeshStandardMaterial({ 
    color: 0xf0f8ff, 
    roughness: 0.1, 
    metalness: 0.8, 
    transparent: true, 
    opacity: 0.7 
  })
  const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.2, 16), glassMat)
  bottle.position.set(-0.1, 0.55, 0)
  bottle.castShadow = true
  group.add(bottle)
  
  const capMat = new THREE.MeshStandardMaterial({ 
    color: 0xffffff, 
    roughness: 0.3, 
    metalness: 0.4 
  })
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.03, 16), capMat)
  cap.position.set(-0.1, 0.68, 0)
  cap.castShadow = true
  group.add(cap)
  
  const labelMat = new THREE.MeshStandardMaterial({ 
    color: 0x4a6a8a, 
    roughness: 0.5, 
    metalness: 0.2 
  })
  const label = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.14), labelMat)
  label.position.set(-0.12, 0.55, 0.081)
  group.add(label)
  
  group.position.set(x, 0, z)
  group.rotation.y = rotY || 0
  scene.add(group)
  return group
}

createCabinet(-4.5, 0, -3.5, 0, 1.2, 1.4, 0.55, 0x3a3530)
createCabinet(4.5, 0, -3.5, 0, 1.2, 1.4, 0.55, 0x3a3530)
createCabinet(-2.8, 0.5, -4.8, Math.PI, 0.9, 0.8, 0.45, 0x4a4035)

createSink(1.8, -4.2)
createMirror(0, 1.75, -5.4)

createChair(-1.5, -1, Math.PI / 6)
createChair(0, -2, -Math.PI / 4)
createChair(1.8, -0.5, Math.PI / 3)

createTable(0, 0)
createBed(-3.5, 3.2)
createBed(3.5, 3.2)

createLamp(-3.2, -3.5)
createLamp(3.2, -3.5)
createLamp(0, -5.2)

createShelf(4.2, 2, -Math.PI / 2)
createShelf(-4.2, 2, Math.PI / 2)

createPlant(-4.8, 2.5)
createPlant(4.8, 2.5)
createPlant(0, 4.2)

createProductDisplay(2.5, 2.2, -Math.PI / 4)
createProductDisplay(-2.5, 2.2, Math.PI / 4)
createProductDisplay(0, 2.2, 0)

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d887d, 0.5)
scene.add(hemiLight)

const dirLight1 = new THREE.DirectionalLight(0xffe6cc, 2.5)
dirLight1.position.set(5, 8, 5)
dirLight1.castShadow = true
dirLight1.shadow.mapSize.width = 2048
dirLight1.shadow.mapSize.height = 2048
dirLight1.shadow.camera.near = 0.5
dirLight1.shadow.camera.far = 20
dirLight1.shadow.camera.left = -8
dirLight1.shadow.camera.right = 8
dirLight1.shadow.camera.top = 8
dirLight1.shadow.camera.bottom = -8
scene.add(dirLight1)

const dirLight2 = new THREE.DirectionalLight(0xccddff, 1.2)
dirLight2.position.set(-3, 4, -2)
dirLight2.castShadow = true
dirLight2.shadow.mapSize.width = 1024
dirLight2.shadow.mapSize.height = 1024
scene.add(dirLight2)

const spotLight = new THREE.SpotLight(0xfff0c0, 80, 8, Math.PI / 6, 0.3, 1.5)
spotLight.position.set(0, 3.2, 0)
spotLight.castShadow = true
spotLight.shadow.mapSize.width = 1024
spotLight.shadow.mapSize.height = 1024
scene.add(spotLight)

function animate() {
  requestAnimationFrame(animate)
  controls.update()
  renderer.render(scene, camera)
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight
  camera.updateProjectionMatrix()
  renderer.setSize(window.innerWidth, window.innerHeight)
})

animate()
</script>
</body>
</html>

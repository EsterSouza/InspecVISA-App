# Gate de liberação do P360-015. Antes disto o Vercel publicava direto do push e
# "CI verde no SHA publicado" não tinha como ser verificado.
#
# O job `sql` reproduz o que o HANDOFF descreve como procedimento manual (Postgres
# puro num container, um arquivo por vez) — as suítes de `supabase/tests` criam o
# próprio fixture, então não precisam do schema do Supabase.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `tsc -b && vite build`: o `tsc --noEmit` avulso não é equivalente e já
      # deixou passar import quebrado que só o build de produção pegou.
      - name: Build
        run: npm run build
      - name: Testes
        run: npm test
      # DEBT-02: o `npm run lint` ainda falha (centenas de `no-explicit-any` sendo zerados
      # por fatia). Ate la o CI cobra o teto por area: nao exige zero, exige nao piorar.
      - name: Lint (teto por area)
        run: npm run lint:teto
      - name: Guardar o build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  sql:
    name: Suítes SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar o psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Um banco por arquivo: as suítes criam as próprias tabelas e várias se
      # incluem entre si (`\ir`), então compartilhar banco faria uma sujar a outra.
      - name: Rodar as suítes
        working-directory: supabase/tests
        run: |
          falhas=0
          for arquivo in *.test.sql; do
            banco="t_$(echo "$arquivo" | tr -c '[:alnum:]' '_')"
            createdb "$banco"
            if psql -d "$banco" -v ON_ERROR_STOP=1 -q -f "$arquivo" > "/tmp/$arquivo.log" 2>&1; then
              echo "OK    $arquivo"
            else
              echo "FALHA $arquivo"
              tail -30 "/tmp/$arquivo.log"
              falhas=$((falhas + 1))
            fi
            dropdb "$banco"
          done
          echo "---"
          if [ "$falhas" -gt 0 ]; then echo "$falhas suíte(s) falharam"; exit 1; fi
          echo "todas as suítes passaram"

  e2e:
    name: E2E (homologação)
    # Só sob demanda: precisa das credenciais do tenant de homologação e roda
    # contra um ambiente publicado, não contra o runner.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [js]
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_PORTAL_EMAIL: ${{ secrets.E2E_PORTAL_EMAIL }}
      E2E_PORTAL_CODE: ${{ secrets.E2E_PORTAL_CODE }}
      E2E_PORTAL_EMAIL_OUTRO_TENANT: ${{ secrets.E2E_PORTAL_EMAIL_OUTRO_TENANT }}
      E2E_PORTAL_CODE_OUTRO_TENANT: ${{ secrets.E2E_PORTAL_CODE_OUTRO_TENANT }}
      E2E_PORTAL_EMAIL_SUSPENSA: ${{ secrets.E2E_PORTAL_EMAIL_SUSPENSA }}
      E2E_PORTAL_CODE_SUSPENSA: ${{ secrets.E2E_PORTAL_CODE_SUSPENSA }}
      # `agenda.spec.ts` e `staff.spec.ts` falam com o Supabase direto para provar
      # isolamento entre tenants e a reserva concorrente. Sem estes três o job
      # falharia em "Falta E2E_SUPABASE_URL" mesmo com todos os outros secrets.
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      E2E_TENANT_HOMOLOG: ${{ secrets.E2E_TENANT_HOMOLOG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

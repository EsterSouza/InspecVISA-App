<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-labelledby="dtitle ddesc"><title id="dtitle">Três encontros que merecem atenção</title><desc id="ddesc">Esquemas sem escala: peça e rejunte são verificados separadamente; rodapé alinhado à parede; emenda fechada no sistema de manta.</desc><g font-family="Segoe UI, sans-serif" fill="#26354a"><rect width="760" height="260" fill="#edf1f4"/><g stroke="#26354a" stroke-width="2" fill="#c5d4df"><path d="M28 102h85v50H28zM127 102h85v50h-85z"/><path d="M294 52h30v118h120v30H294z"/><path d="M552 135h72v20h-72zM634 135h88v20h-88z"/></g><path d="M113 102h14v50h-14zM324 152h14v18h-14zM624 135h10v20h-10z" fill="#987032"/><g font-size="15"><text x="28" y="36">Peça + rejunte</text><text x="294" y="36">Piso + parede</text><text x="552" y="36">Manta + emenda</text><text x="28" y="190">Duas verificações</text><text x="294" y="228">Canto acessível à limpeza</text><text x="552" y="190">Fechamento do sistema</text></g><g stroke="#987032" stroke-width="1.5" fill="none"><path d="M120 98V68h65M342 159h75v-45M629 130V84h60"/></g><g font-size="12"><text x="140" y="61">junta</text><text x="371" y="107">alinhamento</text><text x="653" y="77">solda</text></g></g></svg>